<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>唐代人物关系网络 — 交互式可视化</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#06080f;color:#c8d6e5;font-family:'Noto Serif SC','Songti SC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden;width:100vw;height:100vh}
svg{position:absolute;top:0;left:0;width:100%;height:100%}

/* Control Panel */
#panel{position:fixed;top:16px;left:16px;width:300px;background:rgba(10,14,26,0.92);border:1px solid rgba(100,120,180,0.2);border-radius:12px;padding:20px;z-index:100;backdrop-filter:blur(12px);max-height:calc(100vh - 32px);overflow-y:auto}
#panel h1{font-size:18px;font-weight:600;color:#e8f0fe;margin-bottom:4px;letter-spacing:1px}
#panel .subtitle{font-size:12px;color:#6b7d99;margin-bottom:16px}
#panel label{display:block;font-size:13px;color:#8fa4c0;margin-bottom:4px;margin-top:12px}
#panel select,#panel input[type=text]{width:100%;padding:8px 10px;background:rgba(20,28,50,0.8);border:1px solid rgba(100,120,180,0.25);border-radius:6px;color:#c8d6e5;font-size:13px;outline:none}
#panel select:focus,#panel input:focus{border-color:#4a9eff}
#panel select option{background:#0e1424}
.btn{display:inline-block;padding:8px 16px;border:1px solid rgba(100,120,180,0.3);border-radius:6px;background:rgba(20,28,50,0.6);color:#8fa4c0;font-size:13px;cursor:pointer;transition:all .2s}
.btn:hover{background:rgba(74,158,255,0.15);border-color:#4a9eff;color:#e8f0fe}
.btn-primary{background:rgba(74,158,255,0.2);border-color:#4a9eff;color:#4a9eff}
.btn-primary:hover{background:rgba(74,158,255,0.35)}
.btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.mode-tabs{display:flex;gap:4px;margin-bottom:12px}
.mode-tab{flex:1;padding:8px 4px;text-align:center;font-size:12px;border:1px solid rgba(100,120,180,0.2);border-radius:6px;cursor:pointer;transition:all .2s;color:#6b7d99}
.mode-tab.active{background:rgba(74,158,255,0.15);border-color:#4a9eff;color:#4a9eff}
.mode-tab:hover{border-color:rgba(100,120,180,0.4)}
.pair-select{display:none}
.pair-select.show{display:block}
.rel-filters{margin-top:12px}
.rel-filters .rel-item{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px}
.rel-filters .rel-color{width:20px;height:3px;border-radius:2px}
.rel-filters input[type=checkbox]{accent-color:#4a9eff}
#stats{margin-top:14px;padding-top:12px;border-top:1px solid rgba(100,120,180,0.15);font-size:12px;color:#4a6080;line-height:1.8}

/* Info Panel */
#info{position:fixed;top:16px;right:16px;width:320px;background:rgba(10,14,26,0.92);border:1px solid rgba(100,120,180,0.2);border-radius:12px;padding:20px;z-index:100;backdrop-filter:blur(12px);display:none;max-height:calc(100vh - 32px);overflow-y:auto}
#info h2{font-size:16px;color:#e8f0fe;margin-bottom:8px}
#info .detail{font-size:13px;line-height:1.8;color:#8fa4c0}
#info .detail b{color:#c8d6e5}
#info .path-step{padding:6px 0;border-bottom:1px solid rgba(100,120,180,0.1);font-size:13px}
#info .path-step:last-child{border-bottom:none}
#info .path-rel{color:#ffb86c;font-size:12px}
#info .path-desc{margin-top:10px;padding:10px;background:rgba(20,28,50,0.5);border-radius:6px;font-size:13px;line-height:1.7;color:#8fa4c0}

/* Legends */
.legend{position:fixed;background:rgba(10,14,26,0.85);border:1px solid rgba(100,120,180,0.15);border-radius:8px;padding:12px 14px;z-index:90;backdrop-filter:blur(8px);font-size:11px}
.legend h3{font-size:12px;color:#6b7d99;margin-bottom:6px;font-weight:500}
.legend-item{display:flex;align-items:center;gap:6px;padding:2px 0;color:#8fa4c0}
.legend-dot{width:10px;height:10px;border-radius:50%}
.legend-sq{width:10px;height:10px}
.legend-line{width:20px;height:2px;border-radius:1px}
#legend-node{bottom:16px;left:16px}
#legend-rel{bottom:16px;right:16px}
#legend-gender{top:16px;right:350px}

/* Search autocomplete */
.search-wrap{position:relative}
.suggest-list{position:absolute;top:100%;left:0;right:0;background:rgba(10,14,26,0.95);border:1px solid rgba(100,120,180,0.25);border-radius:0 0 6px 6px;max-height:200px;overflow-y:auto;z-index:200;display:none}
.suggest-list.show{display:block}
.suggest-item{padding:8px 10px;font-size:13px;cursor:pointer;color:#8fa4c0}
.suggest-item:hover,.suggest-item.active{background:rgba(74,158,255,0.15);color:#e8f0fe}
.suggest-item .tag{font-size:10px;padding:1px 5px;border-radius:3px;margin-left:6px}
.tag-core{background:rgba(74,158,255,0.2);color:#4a9eff}
.tag-bridge{background:rgba(100,120,180,0.15);color:#6b7d99}

/* Tooltip */
#tooltip{position:fixed;background:rgba(10,14,26,0.95);border:1px solid rgba(100,120,180,0.3);border-radius:8px;padding:10px 14px;z-index:200;pointer-events:none;display:none;font-size:12px;line-height:1.6;max-width:260px}
#tooltip .tt-name{font-size:14px;color:#e8f0fe;font-weight:600}
#tooltip .tt-info{color:#8fa4c0}

/* Responsive */
@media(max-width:768px){
  #panel{width:calc(100% - 32px);max-height:40vh}
  #info{top:auto;bottom:16px;right:16px;left:16px;width:auto;max-height:35vh}
  #legend-gender{display:none}
}
</style>
</head>
<body>

<div id="panel">
  <h1>唐代人物关系网络</h1>
  <div class="subtitle">按桥接等级着色 · 力导向布局</div>

  <div class="mode-tabs">
    <div class="mode-tab active" data-mode="overview">全局总览</div>
    <div class="mode-tab" data-mode="single">单人聚焦</div>
    <div class="mode-tab" data-mode="pair">双人关联</div>
  </div>

  <div id="single-controls" style="display:none">
    <label>选择人物</label>
    <div class="search-wrap">
      <input type="text" id="search1" placeholder="输入姓名搜索…" autocomplete="off">
      <div class="suggest-list" id="suggest1"></div>
    </div>
  </div>

  <div id="pair-controls" style="display:none">
    <label>人物 A</label>
    <div class="search-wrap">
      <input type="text" id="searchA" placeholder="输入姓名搜索…" autocomplete="off">
      <div class="suggest-list" id="suggestA"></div>
    </div>
    <label style="margin-top:8px">人物 B</label>
    <div class="search-wrap">
      <input type="text" id="searchB" placeholder="输入姓名搜索…" autocomplete="off">
      <div class="suggest-list" id="suggestB"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-find-path">查找关联路径</button>
    </div>
  </div>

  <div class="rel-filters">
    <label>关系类型筛选</label>
    <div class="rel-item"><input type="checkbox" checked data-rel="KIN"><div class="rel-line" style="background:#ff5555"></div><span>亲属</span></div>
    <div class="rel-item"><input type="checkbox" checked data-rel="TEACHER_STUDENT"><div class="rel-line" style="background:#ffb86c"></div><span>师生</span></div>
    <div class="rel-item"><input type="checkbox" checked data-rel="COLLEAGUE"><div class="rel-line" style="background:#6272a4"></div><span>同僚</span></div>
    <div class="rel-item"><input type="checkbox" checked data-rel="LITERARY"><div class="rel-line" style="background:#bd93f9"></div><span>文学</span></div>
    <div class="rel-item"><input type="checkbox" checked data-rel="POLITICAL"><div class="rel-line" style="background:#ff79c6"></div><span>政治</span></div>
    <div class="rel-item"><input type="checkbox" checked data-rel="SOCIAL"><div class="rel-line" style="background:#44475a"></div><span>社交</span></div>
  </div>

  <div class="btn-row">
    <button class="btn" id="btn-reset">⟲ 重置视图</button>
    <button class="btn" id="btn-zoom-fit">⊡ 适应画面</button>
  </div>

  <div id="stats"></div>
</div>

<div id="info">
  <h2 id="info-title"></h2>
  <div id="info-body"></div>
  <div class="btn-row"><button class="btn" onclick="closeInfo()">关闭</button></div>
</div>

<div id="tooltip"></div>

<div class="legend" id="legend-node">
  <h3>人物类型</h3>
  <div class="legend-item"><div class="legend-dot" style="background:#4a9eff"></div>核心人物（男）</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ff6b8a"></div>核心人物（女）</div>
  <div class="legend-item"><div class="legend-sq" style="background:#ffd700"></div>桥接 A（孤立连接）</div>
  <div class="legend-item"><div class="legend-sq" style="background:#50fa7b"></div>桥接 B（3+ 核心连接）</div>
  <div class="legend-item"><div class="legend-sq" style="background:#8be9fd"></div>桥接 C（2 核心连接）</div>
</div>

<div class="legend" id="legend-rel">
  <h3>关系类型</h3>
  <div class="legend-item"><div class="legend-line" style="background:#ff5555"></div>亲属</div>
  <div class="legend-item"><div class="legend-line" style="background:#ffb86c"></div>师生</div>
  <div class="legend-item"><div class="legend-line" style="background:#6272a4"></div>同僚</div>
  <div class="legend-item"><div class="legend-line" style="background:#bd93f9"></div>文学</div>
  <div class="legend-item"><div class="legend-line" style="background:#ff79c6"></div>政治</div>
  <div class="legend-item"><div class="legend-line" style="background:#44475a"></div>社交</div>
</div>

<svg id="network">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g id="g-edges"></g>
  <g id="g-nodes"></g>
  <g id="g-labels"></g>
</svg>

// ========== CONSTANTS ==========
const REL_COLORS = {
  KIN: '#ff5555',
  TEACHER_STUDENT: '#ffb86c',
  COLLEAGUE: '#6272a4',
  LITERARY: '#bd93f9',
  POLITICAL: '#ff79c6',
  SOCIAL: '#44475a'
};
const REL_LABELS = {
  KIN: '亲属', TEACHER_STUDENT: '师生', COLLEAGUE: '同僚',
  LITERARY: '文学', POLITICAL: '政治', SOCIAL: '社交'
};
const TIER_COLORS = { A: '#ffd700', B: '#50fa7b', C: '#8be9fd' };

// ========== STATE ==========
let mode = 'overview';
let selectedPerson = null;
let selectedA = null;
let selectedB = null;
let pathResult = null;
let activeRelTypes = new Set(Object.keys(REL_COLORS));
let simulation, svg, gEdges, gNodes, gLabels, zoom;
let nodesData, edgesData, adjList, personMap;

// ========== INIT ==========
function init() {
  // Build data structures
  personMap = {};
  RAW.persons.forEach(p => { personMap[p.id] = p; });

  nodesData = RAW.persons.map(p => ({
    id: p.id,
    name: p.name,
    role: p.role,
    bridge_tier: p.bridge_tier,
    is_female: p.is_female,
    birthyear: p.birthyear,
    deathyear: p.deathyear,
    dynasty: p.dynasty,
    degree: 0
  }));

  // Build adjacency
  adjList = {};
  nodesData.forEach(n => { adjList[n.id] = []; });

  edgesData = RAW.relationships.map(r => ({
    source: r.source,
    target: r.target,
    type: r.type,
    subtype: r.subtype,
    desc: r.desc,
    weight: r.weight
  }));

  edgesData.forEach(e => {
    adjList[e.source].push({ neighbor: e.target, rel: e });
    adjList[e.target].push({ neighbor: e.source, rel: e });
  });

  nodesData.forEach(n => { n.degree = adjList[n.id].length; });

  // SVG setup
  const w = window.innerWidth, h = window.innerHeight;
  svg = d3.select('#network').attr('width', w).attr('height', h);
  gEdges = svg.select('#g-edges');
  gNodes = svg.select('#g-nodes');
  gLabels = svg.select('#g-labels');

  // Zoom
  zoom = d3.zoom()
    .scaleExtent([0.1, 8])
    .on('zoom', e => {
      gEdges.attr('transform', e.transform);
      gNodes.attr('transform', e.transform);
      gLabels.attr('transform', e.transform);
    });
  svg.call(zoom);

  // Draw edges
  gEdges.selectAll('line')
    .data(edgesData)
    .join('line')
    .attr('stroke', d => REL_COLORS[d.type] || '#44475a')
    .attr('stroke-width', d => d.type === 'KIN' || d.type === 'TEACHER_STUDENT' ? 1.5 : 0.8)
    .attr('stroke-opacity', 0.35)
    .attr('class', d => `edge edge-${d.type}`);

  // Draw nodes
  gNodes.selectAll('.node')
    .data(nodesData)
    .join('g')
    .attr('class', d => `node node-${d.role}`)
    .each(function(d) {
      const g = d3.select(this);
      const r = getNodeRadius(d);
      if (d.role === 'core') {
        g.append('circle').attr('r', r)
          .attr('fill', d.is_female ? '#ff6b8a' : '#4a9eff')
          .attr('stroke', 'rgba(255,255,255,0.15)')
          .attr('stroke-width', 0.5);
      } else {
        const sz = r * 1.4;
        g.append('rect').attr('x', -sz/2).attr('y', -sz/2)
          .attr('width', sz).attr('height', sz)
          .attr('fill', TIER_COLORS[d.bridge_tier] || '#555')
          .attr('opacity', 0.7)
          .attr('stroke', 'rgba(255,255,255,0.1)')
          .attr('stroke-width', 0.5);
      }
    })
    .call(d3.drag()
      .on('start', dragStart)
      .on('drag', dragging)
      .on('end', dragEnd))
    .on('mouseover', showTooltip)
    .on('mouseout', hideTooltip)
    .on('click', (e, d) => { e.stopPropagation(); onNodeClick(d); });

  // Labels (hidden by default)
  gLabels.selectAll('text')
    .data(nodesData)
    .join('text')
    .attr('class', 'node-label')
    .text(d => d.name)
    .attr('font-size', d => d.role === 'core' ? 10 : 8)
    .attr('fill', '#c8d6e5')
    .attr('text-anchor', 'middle')
    .attr('dy', d => -getNodeRadius(d) - 4)
    .attr('opacity', 0)
    .attr('pointer-events', 'none');

  // Force simulation
  simulation = d3.forceSimulation(nodesData)
    .force('link', d3.forceLink(edgesData).id(d => d.id).distance(60).strength(0.3))
    .force('charge', d3.forceManyBody().strength(-120).distanceMax(400))
    .force('center', d3.forceCenter(w / 2, h / 2))
    .force('collide', d3.forceCollide().radius(d => getNodeRadius(d) + 2))
    .force('x', d3.forceX(w / 2).strength(0.03))
    .force('y', d3.forceY(h / 2).strength(0.03))
    .on('tick', tick);

  // Click on background to reset
  svg.on('click', () => { if (mode === 'overview') return; resetView(); });

  updateStats();
  setupUI();
}

function getNodeRadius(d) {
  if (d.role === 'core') {
    return Math.max(3, Math.min(10, 2 + Math.sqrt(d.degree)));
  }
  return Math.max(2, Math.min(6, 1.5 + Math.sqrt(d.degree)));
}

function tick() {
  gEdges.selectAll('line')
    .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x).attr('y2', d => d.target.y);

  gNodes.selectAll('.node')
    .attr('transform', d => `translate(${d.x},${d.y})`);

  gLabels.selectAll('text')
    .attr('x', d => d.x).attr('y', d => d.y);
}

// ========== DRAG ==========
function dragStart(e, d) {
  if (!e.active) simulation.alphaTarget(0.1).restart();
  d.fx = d.x; d.fy = d.y;
}
function dragging(e, d) { d.fx = e.x; d.fy = e.y; }
function dragEnd(e, d) {
  if (!e.active) simulation.alphaTarget(0);
  d.fx = null; d.fy = null;
}

// ========== TOOLTIP ==========
function showTooltip(e, d) {
  const tt = document.getElementById('tooltip');
  const relLabels = (adjList[d.id] || []).slice(0, 8).map(a => personMap[a.neighbor]?.name).filter(Boolean);
  const more = (adjList[d.id] || []).length > 8 ? `…等共${adjList[d.id].length}人` : '';
  tt.innerHTML = `<div class="tt-name">${d.name}</div>
    <div class="tt-info">${d.dynasty || ''} · ${d.birthyear || '?'}–${d.deathyear || '?'}<br>
    ${d.role === 'core' ? '核心人物' : '桥接 ' + d.bridge_tier} · 度数 ${d.degree}<br>
    关联：${relLabels.join('、')}${more}</div>`;
  tt.style.display = 'block';
  tt.style.left = (e.clientX + 14) + 'px';
  tt.style.top = (e.clientY - 10) + 'px';
}
function hideTooltip() { document.getElementById('tooltip').style.display = 'none'; }

// ========== NODE CLICK ==========
function onNodeClick(d) {
  if (mode === 'single') {
    selectPerson(d.id, 1);
  } else if (mode === 'pair') {
    // Assign to whichever search is focused or A by default
    if (!selectedA) selectPerson(d.id, 'A');
    else if (!selectedB) selectPerson(d.id, 'B');
  }
}

// ========== UI SETUP ==========
function setupUI() {
  // Mode tabs
  document.querySelectorAll('.mode-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      mode = tab.dataset.mode;
      document.getElementById('single-controls').style.display = mode === 'single' ? 'block' : 'none';
      document.getElementById('pair-controls').style.display = mode === 'pair' ? 'block' : 'none';
      resetView();
    });
  });

  // Search autocomplete
  setupSearch('search1', 'suggest1', id => selectPerson(id, 1));
  setupSearch('searchA', 'suggestA', id => selectPerson(id, 'A'));
  setupSearch('searchB', 'suggestB', id => selectPerson(id, 'B'));

  // Find path button
  document.getElementById('btn-find-path').addEventListener('click', findAndShowPath);

  // Reset
  document.getElementById('btn-reset').addEventListener('click', resetView);
  document.getElementById('btn-zoom-fit').addEventListener('click', zoomToFit);

  // Relation type filters
  document.querySelectorAll('.rel-filters input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', () => {
      if (cb.checked) activeRelTypes.add(cb.dataset.rel);
      else activeRelTypes.delete(cb.dataset.rel);
      applyRelFilter();
    });
  });
}

function setupSearch(inputId, suggestId, onSelect) {
  const input = document.getElementById(inputId);
  const suggest = document.getElementById(suggestId);
  let activeIdx = -1;

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (!q) { suggest.classList.remove('show'); return; }
    const matches = nodesData.filter(n =>
      n.name.toLowerCase().includes(q) || (n.name_rm || '').toLowerCase().includes(q)
    ).slice(0, 12);
    if (!matches.length) { suggest.classList.remove('show'); return; }
    suggest.innerHTML = matches.map((m, i) =>
      `<div class="suggest-item" data-id="${m.id}" data-idx="${i}">
        ${m.name} <span class="tag ${m.role === 'core' ? 'tag-core' : 'tag-bridge'}">${m.role === 'core' ? '核心' : '桥接'}</span>
        <span style="color:#4a6080;font-size:11px;margin-left:4px">${m.dynasty || ''}</span>
      </div>`
    ).join('');
    suggest.classList.add('show');
    activeIdx = -1;

    suggest.querySelectorAll('.suggest-item').forEach(item => {
      item.addEventListener('click', () => {
        const id = +item.dataset.id;
        input.value = personMap[id].name;
        suggest.classList.remove('show');
        onSelect(id);
      });
    });
  });

  input.addEventListener('keydown', e => {
    const items = suggest.querySelectorAll('.suggest-item');
    if (!items.length) return;
    if (e.key === 'ArrowDown') { activeIdx = Math.min(activeIdx + 1, items.length - 1); updateActive(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { activeIdx = Math.max(activeIdx - 1, 0); updateActive(); e.preventDefault(); }
    else if (e.key === 'Enter' && activeIdx >= 0) { items[activeIdx].click(); e.preventDefault(); }
    else if (e.key === 'Escape') { suggest.classList.remove('show'); }
  });

  function updateActive() {
    suggest.querySelectorAll('.suggest-item').forEach((it, i) => it.classList.toggle('active', i === activeIdx));
  }

  // Close on outside click
  document.addEventListener('click', e => {
    if (!input.contains(e.target) && !suggest.contains(e.target)) suggest.classList.remove('show');
  });
}

// ========== PERSON SELECTION ==========
function selectPerson(id, which) {
  const p = personMap[id];
  if (!p) return;

  if (which === 1) {
    selectedPerson = id;
    document.getElementById('search1').value = p.name;
    highlightEgoNetwork(id);
    showPersonInfo(id);
  } else if (which === 'A') {
    selectedA = id;
    document.getElementById('searchA').value = p.name;
    if (mode === 'pair' && selectedB) findAndShowPath();
    else highlightEgoNetwork(id);
  } else if (which === 'B') {
    selectedB = id;
    document.getElementById('searchB').value = p.name;
    if (mode === 'pair' && selectedA) findAndShowPath();
  }
}

// ========== HIGHLIGHT EGO NETWORK ==========
function highlightEgoNetwork(centerId) {
  const neighbors = new Set([centerId]);
  const neighborEdges = new Set();

  (adjList[centerId] || []).forEach(a => {
    if (activeRelTypes.has(a.rel.type)) {
      neighbors.add(a.neighbor);
      neighborEdges.add(getEdgeKey(a.rel));
    }
  });

  // Dim everything
  gNodes.selectAll('.node')
    .transition().duration(400)
    .attr('opacity', d => neighbors.has(d.id) ? 1 : 0.06);

  gEdges.selectAll('line')
    .transition().duration(400)
    .attr('stroke-opacity', d => neighborEdges.has(getEdgeKey(d)) ? 0.7 : 0.03)
    .attr('stroke-width', d => neighborEdges.has(getEdgeKey(d)) ? 2 : 0.5);

  // Show labels for neighbors
  gLabels.selectAll('text')
    .transition().duration(400)
    .attr('opacity', d => neighbors.has(d.id) ? 1 : 0)
    .attr('font-size', d => d.id === centerId ? 13 : 9)
    .attr('font-weight', d => d.id === centerId ? 'bold' : 'normal')
    .attr('fill', d => d.id === centerId ? '#fff' : '#c8d6e5');

  // Glow on center
  gNodes.selectAll('.node')
    .select('circle, rect')
    .attr('filter', d => d.id === centerId ? 'url(#glow-strong)' : 'none');

  // Zoom to fit
  zoomToNodes([...neighbors]);

  updateStats(`聚焦：${personMap[centerId].name} · ${neighbors.size - 1} 位关联人物 · ${neighborEdges.size} 条关系`);
}

// ========== FIND PATH (BFS) ==========
function findAndShowPath() {
  if (!selectedA || !selectedB) return;
  if (selectedA === selectedB) return;

  // BFS
  const visited = new Set([selectedA]);
  const queue = [[selectedA]];

  while (queue.length > 0) {
    const path = queue.shift();
    const current = path[path.length - 1];
    if (current === selectedB) {
      pathResult = path;
      highlightPath(path);
      showPathInfo(path);
      return;
    }
    for (const edge of (adjList[current] || [])) {
      if (!activeRelTypes.has(edge.rel.type)) continue;
      if (!visited.has(edge.neighbor)) {
        visited.add(edge.neighbor);
        queue.push([...path, edge.neighbor]);
      }
    }
  }

  // No path found
  pathResult = null;
  showNoPathInfo();
}

function highlightPath(path) {
  const pathNodes = new Set(path);
  const pathEdges = new Set();
  for (let i = 0; i < path.length - 1; i++) {
    const s = path[i], t = path[i + 1];
    // Find the edge
    for (const e of edgesData) {
      if ((e.source.id === s && e.target.id === t) || (e.source.id === t && e.target.id === s)) {
        if (activeRelTypes.has(e.type)) {
          pathEdges.add(getEdgeKey(e));
          break;
        }
      }
    }
  }

  gNodes.selectAll('.node')
    .transition().duration(400)
    .attr('opacity', d => pathNodes.has(d.id) ? 1 : 0.06);

  gEdges.selectAll('line')
    .transition().duration(400)
    .attr('stroke-opacity', d => pathEdges.has(getEdgeKey(d)) ? 0.85 : 0.03)
    .attr('stroke-width', d => pathEdges.has(getEdgeKey(d)) ? 3 : 0.5);

  gLabels.selectAll('text')
    .transition().duration(400)
    .attr('opacity', d => pathNodes.has(d.id) ? 1 : 0)
    .attr('font-size', d => (d.id === selectedA || d.id === selectedB) ? 13 : 10)
    .attr('font-weight', d => (d.id === selectedA || d.id === selectedB) ? 'bold' : 'normal')
    .attr('fill', d => (d.id === selectedA || d.id === selectedB) ? '#fff' : '#c8d6e5');

  gNodes.selectAll('.node')
    .select('circle, rect')
    .attr('filter', d => (d.id === selectedA || d.id === selectedB) ? 'url(#glow-strong)' : 'none');

  zoomToNodes([...pathNodes]);
  updateStats(`路径长度：${path.length - 1} 步 · ${path.length} 位人物`);
}

// ========== INFO PANEL ==========
function showPersonInfo(id) {
  const p = personMap[id];
  const neighbors = adjList[id] || [];
  const relSummary = {};
  neighbors.forEach(a => {
    if (!activeRelTypes.has(a.rel.type)) return;
    const t = REL_LABELS[a.rel.type] || a.rel.type;
    relSummary[t] = (relSummary[t] || 0) + 1;
  });
  const relStr = Object.entries(relSummary).map(([k, v]) => `${k} ${v}`).join('、');

  const neighborNames = neighbors
    .filter(a => activeRelTypes.has(a.rel.type))
    .slice(0, 20)
    .map(a => {
      const np = personMap[a.neighbor];
      return np ? `${np.name}（${REL_LABELS[a.rel.type]}）` : '';
    }).filter(Boolean);

  document.getElementById('info-title').textContent = p.name;
  document.getElementById('info-body').innerHTML =
    `<div class="detail">
      <b>朝代：</b>${p.dynasty || '—'}<br>
      <b>生卒：</b>${p.birthyear || '?'}–${p.deathyear || '?'}<br>
      <b>类型：</b>${p.role === 'core' ? '核心人物' : '桥接人物（Tier ' + p.bridge_tier + '）'}<br>
      <b>性别：</b>${p.is_female ? '女' : '男'}<br>
      <b>连接数：</b>${p.degree}<br>
      <b>关系分布：</b>${relStr || '—'}<br>
      <b>关联人物：</b><br>${neighborNames.join('、') || '—'}
    </div>`;
  document.getElementById('info').style.display = 'block';
}

function showPathInfo(path) {
  const steps = [];
  for (let i = 0; i < path.length - 1; i++) {
    const from = personMap[path[i]];
    const to = personMap[path[i + 1]];
    // Find the relationship
    let relDesc = '关联';
    for (const edge of (adjList[path[i]] || [])) {
      if (edge.neighbor === path[i + 1] && activeRelTypes.has(edge.rel.type)) {
        relDesc = `${REL_LABELS[edge.rel.type]}`;
        if (edge.rel.desc) relDesc += `（${edge.rel.desc}）`;
        break;
      }
    }
    steps.push({ from: from.name, to: to.name, rel: relDesc });
  }

  const pathText = steps.map((s, i) =>
    `<div class="path-step"><b>${s.from}</b> <span class="path-rel">→ ${s.rel} →</span> <b>${s.to}</b></div>`
  ).join('');

  const descText = generatePathDescription(steps);

  document.getElementById('info-title').textContent =
    `${personMap[selectedA].name} ↔ ${personMap[selectedB].name}`;
  document.getElementById('info-body').innerHTML =
    `<div class="detail">
      <b>关联路径</b>（${path.length - 1} 步）<br>
      ${pathText}
    </div>
    <div class="path-desc">${descText}</div>`;
  document.getElementById('info').style.display = 'block';
}

function generatePathDescription(steps) {
  if (steps.length === 1) {
    return `${steps[0].from}与${steps[0].to}之间存在直接的${steps[0].rel}关系。`;
  }
  let desc = `${steps[0].from}与${steps[steps.length - 1].to}之间相隔 ${steps.length} 步：\n`;
  desc += steps.map(s => `${s.from} ——${s.rel}—— ${s.to}`).join('\n');
  return desc;
}

function showNoPathInfo() {
  document.getElementById('info-title').textContent =
    `${personMap[selectedA]?.name || '?'} ↔ ${personMap[selectedB]?.name || '?'}`;
  document.getElementById('info-body').innerHTML =
    `<div class="detail">在当前关系类型筛选下，未找到两人的关联路径。<br><br>尝试勾选更多关系类型后重试。</div>`;
  document.getElementById('info').style.display = 'block';
}

function closeInfo() { document.getElementById('info').style.display = 'none'; }

// ========== REL FILTER ==========
function applyRelFilter() {
  gEdges.selectAll('line')
    .transition().duration(300)
    .attr('stroke-opacity', d => activeRelTypes.has(d.type) ? 0.35 : 0.02);

  if (mode === 'single' && selectedPerson) highlightEgoNetwork(selectedPerson);
  else if (mode === 'pair' && selectedA && selectedB) findAndShowPath();
}

// ========== RESET ==========
function resetView() {
  selectedPerson = null;
  selectedA = null;
  selectedB = null;
  pathResult = null;

  document.getElementById('search1').value = '';
  document.getElementById('searchA').value = '';
  document.getElementById('searchB').value = '';

  gNodes.selectAll('.node')
    .transition().duration(500)
    .attr('opacity', 1);

  gNodes.selectAll('.node').select('circle, rect')
    .attr('filter', 'none');

  gEdges.selectAll('line')
    .transition().duration(500)
    .attr('stroke-opacity', 0.35)
    .attr('stroke-width', d => d.type === 'KIN' || d.type === 'TEACHER_STUDENT' ? 1.5 : 0.8);

  gLabels.selectAll('text')
    .transition().duration(500)
    .attr('opacity', 0);

  closeInfo();

  simulation.alpha(0.3).restart();
  updateStats();
  zoomToFit();
}

// ========== ZOOM ==========
function zoomToFit() {
  const bounds = gNodes.node().getBBox();
  if (!bounds.width || !bounds.height) return;
  const w = window.innerWidth, h = window.innerHeight;
  const scale = Math.min(w / (bounds.width + 100), h / (bounds.height + 100)) * 0.85;
  const tx = w / 2 - (bounds.x + bounds.width / 2) * scale;
  const ty = h / 2 - (bounds.y + bounds.height / 2) * scale;
  svg.transition().duration(700)
    .call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
}

function zoomToNodes(nodeIds) {
  const pts = nodesData.filter(n => nodeIds.has(n.id));
  if (!pts.length) return;
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys), y1 = Math.max(...ys);
  const w = window.innerWidth, h = window.innerHeight;
  const bw = x1 - x0 || 100, bh = y1 - y0 || 100;
  const scale = Math.min(w / (bw + 120), h / (bh + 120)) * 0.8;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const tx = w / 2 - cx * scale, ty = h / 2 - cy * scale;
  svg.transition().duration(700)
    .call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
}

// ========== UTILS ==========
function getEdgeKey(e) {
  const s = typeof e.source === 'object' ? e.source.id : e.source;
  const t = typeof e.target === 'object' ? e.target.id : e.target;
  return `${Math.min(s,t)}-${Math.max(s,t)}-${e.type}`;
}

function updateStats(msg) {
  const el = document.getElementById('stats');
  const coreN = nodesData.filter(n => n.role === 'core').length;
  const bridgeN = nodesData.filter(n => n.role === 'bridge').length;
  el.innerHTML = msg || `核心 ${coreN} 人 · 桥接 ${bridgeN} 人 · 关系 ${edgesData.length} 条<br>节点可拖拽 · 滚轮缩放 · 点击节点查看详情`;
}

// ========== RESIZE ==========
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  svg.attr('width', w).attr('height', h);
  simulation.force('center', d3.forceCenter(w / 2, h / 2));
  simulation.force('x', d3.forceX(w / 2).strength(0.03));
  simulation.force('y', d3.forceY(h / 2).strength(0.03));
  simulation.alpha(0.1).restart();
});

// ========== START ==========
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
